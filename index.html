<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="style.css?v=74"><link rel="manifest" href="manifest.webmanifest?v=74"><title>即時譯 V7.4｜翻譯</title></head><body><main class="app"><div class="top-switch"><a href="index.html">🌐 翻譯</a><a href="sos.html">🆘 求助</a><a href="risk.html">⚠️ 風險</a><a href="contacts.html">📞 聯絡人</a></div>
<header><div class="eyebrow">V7.4 · FACE TO FACE · SOS GUIDE · OFFLINE</div><h1>🌐 翻譯</h1><p>單向、雙向、面對面三種模式。</p></header>
<section class="card mode"><button id="m1" class="active">單向</button><button id="m2">雙向</button><button id="m3">面對面</button></section>
<div id="single"><section class="card"><div class="langrow"><select id="from"></select><button id="swap">⇄</button><select id="to"></select></div><textarea id="input" placeholder="使用 iPhone 鍵盤聽寫或輸入文字"></textarea><div class="settings"><label><input id="autot" type="checkbox" checked> 自動翻譯</label><label><input id="autos" type="checkbox" checked> 自動朗讀</label></div><div class="settings">
      <label>語音模式<select id="voiceMode"><option value="natural">自然</option><option value="slow">慢速</option><option value="clear">清晰</option></select></label>
      <label>翻譯穩定模式<select id="translationMode"><option value="fast">快速</option><option value="stable" selected>穩定（失敗重試一次）</option></select></label>
    </div>
    <div class="actions"><button id="go" class="primary">翻譯</button><button id="audio">啟用語音</button></div>
    <div id="translationStatus" class="small">穩定模式：8 秒逾時，必要時自動重試一次。</div><div id="out" class="result">尚未翻譯</div></section></div>
<div id="two" hidden><section class="card"><div class="langrow"><select id="aLang"></select><button id="swap2">⇄</button><select id="bLang"></select></div></section><section class="card"><b>A 方</b><textarea id="aIn"></textarea><button id="aGo" class="primary">A → B</button><div id="aOut" class="result"></div></section><section class="card"><b>B 方</b><textarea id="bIn"></textarea><button id="bGo" class="primary">B → A</button><div id="bOut" class="result"></div></section></div>
<div id="face" hidden><section class="card"><button id="faceFullscreen" class="primary">⛶ 全螢幕面對面</button><div class="langrow"><select id="fa"></select><button id="fswap">⇄</button><select id="fb"></select></div></section><div class="face"><section class="top"><b id="fbLabel">B 方</b><div id="fbOut" class="faceout">等待 A 方</div></section><div class="divider">⇅</div><section><b id="faLabel">A 方</b><textarea id="faIn"></textarea><button id="faGo" class="primary">A → B</button><div id="faOut" class="faceout">等待 B 方</div><textarea id="fbIn"></textarea><button id="fbGo" class="primary">B → A</button></section></div></div>
</main><nav class="bottom-nav"><a href="index.html">🌐<span>翻譯</span></a><a href="sos.html">🆘<span>求助</span></a><a href="risk.html">⚠️<span>風險</span></a><a href="contacts.html">📞<span>聯絡人</span></a></nav><script src="shared.js?v=74"></script><script src="translate.js?v=74"></script></body></html>
