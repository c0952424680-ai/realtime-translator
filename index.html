<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A84FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="即時譯">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>即時譯 V3</title>
</head>
<body>
<main class="app">
  <header>
    <div>
      <div class="eyebrow">V3 · FAST TRANSLATE</div>
      <h1>即時譯</h1>
      <p>自由句翻譯・低延遲版</p>
    </div>
    <span id="netState" class="pill">檢查網路</span>
  </header>

  <section class="langs">
    <select id="from">
      <option value="zh-TW">🇹🇼 中文</option>
      <option value="en-US">🇺🇸 English</option>
      <option value="ja-JP">🇯🇵 日本語</option>
      <option value="ko-KR">🇰🇷 한국어</option>
    </select>
    <button id="swap">⇄</button>
    <select id="to">
      <option value="ja-JP">🇯🇵 日本語</option>
      <option value="en-US">🇺🇸 English</option>
      <option value="zh-TW">🇹🇼 中文</option>
      <option value="ko-KR">🇰🇷 한국어</option>
    </select>
  </section>

  <section class="card">
    <textarea id="input" placeholder="輸入較長句子也可以，例如：我想去東京車站，但不知道在哪裡換車。"></textarea>
    <div class="actions">
      <button id="mic" class="primary">🎙️ 語音輸入</button>
      <button id="translate">⚡ 快速翻譯</button>
    </div>
    <div class="minirow">
      <button id="clear">清除</button>
      <span id="latency">等待翻譯</span>
    </div>
  </section>

  <section class="result">
    <div class="label">翻譯結果</div>
    <div id="output">尚未翻譯</div>
    <div class="actions">
      <button id="speak">🔊 播放翻譯</button>
      <button id="copy">📋 複製</button>
    </div>
    <small id="engine">翻譯引擎待命</small>
  </section>

  <section class="history">
    <div class="section-title">最近翻譯</div>
    <div id="history"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
