<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A84FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="即時譯">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>即時譯</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">VOICE FIX V2</div>
        <h1>即時譯</h1>
      </div>
      <span id="audioState" class="pill">音訊待檢查</span>
    </header>

    <section class="langs">
      <select id="from">
        <option value="zh-TW">🇹🇼 中文</option>
        <option value="en-US">🇺🇸 English</option>
        <option value="ja-JP">🇯🇵 日本語</option>
        <option value="ko-KR">🇰🇷 한국어</option>
      </select>
      <button id="swap">⇄</button>
      <select id="to">
        <option value="ja-JP">🇯🇵 日本語</option>
        <option value="en-US">🇺🇸 English</option>
        <option value="zh-TW">🇹🇼 中文</option>
        <option value="ko-KR">🇰🇷 한국어</option>
      </select>
    </section>

    <section class="card">
      <textarea id="input" placeholder="輸入文字，或按麥克風說話…"></textarea>
      <div class="meter-wrap">
        <div class="meter"><div id="meterBar"></div></div>
        <small id="meterText">尚未取得麥克風</small>
      </div>
      <div class="actions">
        <button id="mic" class="primary">🎙️ 啟用麥克風</button>
        <button id="translate">翻譯</button>
      </div>
    </section>

    <section class="result">
      <div class="label">翻譯結果</div>
      <div id="output">尚未翻譯</div>
      <div class="actions">
        <button id="speak">🔊 播放翻譯</button>
        <button id="testVoice">🧪 測試聲音</button>
      </div>
      <small id="voiceInfo">尚未載入語音</small>
    </section>

    <section class="debug">
      <strong>音訊狀態</strong>
      <div id="debugText">準備中…</div>
    </section>
  </main>
<script src="app.js"></script>
</body>
</html>
