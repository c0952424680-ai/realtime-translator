<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A84FF"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest?v=72"><link rel="stylesheet" href="style.css?v=72">
<title>即時譯 V7.2｜翻譯</title></head><body>
<main class="app"><div class="top-switch">
<a href="index.html">🌐 翻譯</a><a href="sos.html">🆘 求助</a><a href="risk.html">⚠️ 風險</a><a href="contacts.html">📞 聯絡人</a>
</div>
<header><div><div class="eyebrow">V7.2 · CLEAN FOUR PAGES</div><h1>🌐 翻譯</h1><p>單向翻譯＋雙向對話，可隨時切換。</p></div><span id="state" class="pill">待命</span></header>
<section class="card mode-switch"><button id="singleBtn" class="active">單向翻譯</button><button id="twoWayBtn">雙向對話</button></section>

<div id="singleView">
<section class="card">
<div class="lang-row"><select id="from"></select><button id="swap" class="swap">⇄</button><select id="to"></select></div>
<label class="label">輸入／鍵盤聽寫</label><textarea id="input" placeholder="點這裡，使用 iPhone 鍵盤 🎙️ 聽寫或直接輸入文字。"></textarea>
<div class="help" id="dictationHint">請切換到對應語言鍵盤後使用 iPhone 聽寫。</div>
<div class="settings"><label class="toggle"><input id="autoTranslate" type="checkbox" checked>自動翻譯</label><label class="toggle"><input id="autoSpeak" type="checkbox" checked>自動朗讀</label></div>
<div class="actions"><button id="translate" class="primary">⚡ 立即翻譯</button><button id="clear">清除</button></div>
<div id="output" class="result">尚未翻譯</div>
<div class="voice-row"><div><b>👩 女聲優先</b><div id="voiceUsed" class="small">尚未播放</div></div><select id="voiceMode"><option value="natural">自然</option><option value="slow">慢速</option><option value="clear">清晰</option></select></div>
<div class="actions"><button id="enableAudio">🔈 啟用語音</button><button id="play">🔊 播放翻譯</button></div>
</section></div>

<div id="twoWayView" hidden>
<section class="card">
<div class="lang-row"><select id="langA"></select><button id="swapAB" class="swap">⇄</button><select id="langB"></select></div>
<div class="settings"><label class="toggle"><input id="autoSpeakAB" type="checkbox" checked>自動朗讀</label><label class="toggle"><input id="autoSwitchAB" type="checkbox" checked>播放後切換到對方</label></div>
</section>
<section class="panel conversation-panel"><div class="speaker-head"><b id="labelA">A 方</b><span id="statusA" class="small">等待輸入</span></div>
<textarea id="inputA" placeholder="A 方輸入或用鍵盤聽寫"></textarea><div class="actions"><button id="goA" class="primary">A → B 翻譯</button><button id="focusA">⌨️ A 方聽寫</button></div><div id="resultA" class="result">尚未翻譯</div></section>
<section class="panel conversation-panel b"><div class="speaker-head"><b id="labelB">B 方</b><span id="statusB" class="small">等待輸入</span></div>
<textarea id="inputB" placeholder="B 方輸入或用鍵盤聽寫"></textarea><div class="actions"><button id="goB" class="primary">B → A 翻譯</button><button id="focusB">⌨️ B 方聽寫</button></div><div id="resultB" class="result">尚未翻譯</div></section>
<section class="card"><div class="speaker-head"><h2>對話紀錄</h2><button id="clearHistory">清除</button></div><div id="history" class="history"><span class="small">尚無紀錄</span></div></section>
</div>
</main><nav class="bottom-nav">
<a href="index.html">🌐<span>翻譯</span></a><a href="sos.html">🆘<span>求助</span></a><a href="risk.html">⚠️<span>風險</span></a><a href="contacts.html">📞<span>聯絡人</span></a>
</nav>
<script src="shared.js?v=72"></script><script src="translate.js?v=72"></script></body></html>
