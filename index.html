<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A84FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="即時譯">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=4">
<title>即時譯 V4</title>
</head>
<body>
<main class="app">
<header><div><div class="eyebrow">V4 · VOICE + TRANSLATE FIX</div><h1>即時譯</h1><p>開始 / 停止錄音・目標語言朗讀・整句翻譯</p></div><span id="statePill" class="pill">待命</span></header>
<section class="langs">
<select id="from"><option value="zh-TW">🇹🇼 中文</option><option value="en-US">🇺🇸 English</option><option value="ja-JP">🇯🇵 日本語</option><option value="ko-KR">🇰🇷 한국어</option></select>
<button id="swap">⇄</button>
<select id="to"><option value="ja-JP">🇯🇵 日本語</option><option value="en-US">🇺🇸 English</option><option value="zh-TW">🇹🇼 中文</option><option value="ko-KR">🇰🇷 한국어</option></select>
</section>
<section class="card">
<textarea id="input" placeholder="按「開始錄音」說話，或直接輸入完整句子。"></textarea>
<div class="voice-status"><span id="recognitionLang">辨識語言：中文</span><span id="recordingTime">00:00</span></div>
<div class="record-actions"><button id="startMic" class="primary">🎙️ 開始錄音</button><button id="stopMic" class="danger" disabled>⏹ 停止錄音</button></div>
<button id="translate" class="full">⚡ 翻譯整句</button>
<div class="minirow"><button id="clear">清除</button><span id="latency">等待翻譯</span></div>
</section>
<section class="result"><div class="label">翻譯結果</div><div id="output">尚未翻譯</div><div class="actions"><button id="speak">🔊 播放翻譯</button><button id="copy">📋 複製</button></div><small id="engine">翻譯引擎待命</small><small id="voiceUsed"></small></section>
<section class="debug"><strong>狀態</strong><div id="debugText">準備完成。</div></section>
</main>
<script src="app.js?v=4"></script>
</body></html>
