<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A84FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="即時譯">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>即時譯</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">OFFLINE FIRST</div>
        <h1>即時譯</h1>
      </div>
      <span class="pill">PWA</span>
    </header>

    <section class="langs">
      <select id="from">
        <option value="zh-TW">🇹🇼 中文</option>
        <option value="en">🇺🇸 English</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
      </select>
      <button id="swap">⇄</button>
      <select id="to">
        <option value="ja">🇯🇵 日本語</option>
        <option value="en">🇺🇸 English</option>
        <option value="zh-TW">🇹🇼 中文</option>
        <option value="ko">🇰🇷 한국어</option>
      </select>
    </section>

    <section class="card">
      <textarea id="input" placeholder="輸入文字，或按麥克風說話…"></textarea>
      <div class="actions">
        <button id="mic" class="primary">🎙️ 開始說話</button>
        <button id="translate">翻譯</button>
      </div>
    </section>

    <section class="result">
      <div class="label">翻譯結果</div>
      <div id="output">尚未翻譯</div>
      <button id="speak">🔊 播放翻譯</button>
    </section>

    <section class="travel">
      <h2>✈️ 離線旅行句</h2>
      <div class="chips">
        <button data-p="你好">你好</button>
        <button data-p="謝謝">謝謝</button>
        <button data-p="請問洗手間在哪裡">洗手間在哪裡</button>
        <button data-p="多少錢">多少錢</button>
        <button data-p="請幫幫我">請幫幫我</button>
      </div>
      <small>旅行常用句可離線；自由翻譯目前需要網路。</small>
    </section>
  </main>
<script src="app.js"></script>
</body>
</html>
