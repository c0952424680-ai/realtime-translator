</section>
<section class="card"><h2>🔔 安全通知</h2><p>V10.0 先支援 App 開啟期間的即時風險聯動與瀏覽器通知權限。真正背景伺服器推播將由後端 Push Service 接續。</p>
<button id="v10EnableRiskNotify" class="primary" onclick="NotificationService.enable().then(ok=>alert(ok?'已啟用通知':'未允許通知'))">啟用通知</button></section>
