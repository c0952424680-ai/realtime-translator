<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=74"><title>即時譯 V7.4｜聯絡人與旅行資料卡</title></head><body><main class="app"><div class="top-switch"><a href="index.html">🌐 翻譯</a><a href="sos.html">🆘 求助</a><a href="risk.html">⚠️ 風險</a><a href="contacts.html">📞 聯絡人</a></div><header><div class="eyebrow">V7.4 · CONTACTS + TRAVEL CARD</div><h1>📞 聯絡人與旅行資料卡</h1></header><section class="card"><h2>緊急聯絡人</h2><div class="form"><label>姓名<input id="cname"></label><label>電話<input id="cphone" type="tel"></label><label>關係<input id="crel"></label><label>事項<input id="cmatter"></label></div><button id="csave" class="primary">儲存聯絡人</button><div id="clist"></div></section><section class="card"><h2>🪪 我的旅行資料卡</h2><div class="privacy-note">🔒 預設隱藏敏感資料；只有你按「顯示資料卡」才會顯示。</div><p class="small">資料只保存在這台手機瀏覽器。</p><div class="form"><label>姓名<input id="name"></label><label>國籍<input id="nat" value="Taiwan"></label><label>血型<input id="blood"></label><label>出生年份<input id="birth" type="number"></label><label>過敏<input id="allergy"></label><label>慢性病<input id="condition"></label><label>常用藥物<input id="meds"></label><label>保險公司<input id="ins"></label><label>保險電話<input id="insphone" type="tel"></label><label>護照末四碼<input id="pass4" maxlength="4"></label><label class="full">重要備註<textarea id="note"></textarea></label></div><div class="actions"><button id="savecard" class="primary">儲存資料卡</button><button id="showcard">顯示／隱藏資料卡</button></div><div id="cardview"></div></section></main><nav class="bottom-nav"><a href="index.html">🌐<span>翻譯</span></a><a href="sos.html">🆘<span>求助</span></a><a href="risk.html">⚠️<span>風險</span></a><a href="contacts.html">📞<span>聯絡人</span></a></nav><script src="shared.js?v=74"></script><script src="contacts.js?v=74"></script></body></html>
